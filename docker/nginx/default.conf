server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/backend/public;

    index index.php index.html;

    charset utf-8;

    # Resolução dinâmica via DNS interno do Docker (evita [emerg] host not found no boot)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    # Cabeçalhos de segurança essenciais
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Otimização de Gzip para transferências mais rápidas de JSON e assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript application/x-javascript text/xml application/xml;
    gzip_min_length 1024;

    location ~ \.php$ {
        fastcgi_pass $backend_host:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;

        # Otimização de FastCGI Buffers em memória
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
