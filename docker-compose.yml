services:
  nginx:
    image: nginx:alpine
    container_name: helpdesk_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - helpdesk_net

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: helpdesk_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - helpdesk_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: helpdesk_queue
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: sh -c "php artisan queue:work redis --tries=3 --timeout=90"
    depends_on:
      - backend
      - mysql
      - redis
    networks:
      - helpdesk_net

  frontend:
    image: node:20-alpine
    container_name: helpdesk_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm run dev -- --host"
    networks:
      - helpdesk_net

  mysql:
    image: mysql:8.0
    container_name: helpdesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: helpdesk_pro
      MYSQL_USER: helpdesk_user
      MYSQL_PASSWORD: helpdesk_secret
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - helpdesk_net

  redis:
    image: redis:7-alpine
    container_name: helpdesk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - helpdesk_net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  helpdesk_net:
    driver: bridge
